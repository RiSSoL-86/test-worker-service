services:
  worker:
    build:
      context: .
      dockerfile: etc/docker/Dockerfile
    container_name: test-worker-service
    restart: always
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BROKER_ADDRESSES
      - DATABASE_URL
      - GRPC_LISTEN_ADDRESS
    logging:
      driver: "json-file"
      options:
        max-size: "500m"

  postgres:
    image: postgres:16
    container_name: postgres-go
    restart: always
    network_mode: host
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "500m"

volumes:
  postgres-data:
